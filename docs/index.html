<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clash 规则编辑器</title>
<style>
:root {
  --bg: #1a1a2e;
  --card: #16213e;
  --accent: #0f3460;
  --primary: #e94560;
  --text: #eee;
  --muted: #8892b0;
  --border: #2a2a4a;
  --success: #4caf50;
  --warning: #ff9800;
  --danger: #f44336;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}
header {
  background: var(--card); padding: 16px 24px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
}
header h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
header h1 small { font-size: 13px; color: var(--muted); font-weight: normal; }
.header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.container { max-width: 1400px; margin: 0 auto; padding: 20px 24px; }

/* 设置面板 */
.settings-panel {
  background: var(--card); border-radius: 8px; padding: 16px; margin-bottom: 20px;
  border: 1px solid var(--border);
}
.settings-panel h2 { font-size: 15px; margin-bottom: 12px; color: var(--muted); }
.settings-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.settings-row label { font-size: 13px; color: var(--muted); }
.settings-row input {
  background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 12px;
  border-radius: 4px; font-size: 13px; flex: 1; min-width: 200px;
}
.settings-row input:focus { outline: none; border-color: var(--primary); }
.btn {
  padding: 6px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px;
  font-weight: 500; transition: opacity 0.2s; white-space: nowrap;
}
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-success { background: var(--success); color: #fff; }
.btn-warning { background: var(--warning); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-sm { padding: 4px 10px; font-size: 12px; }

/* 文件列表 */
.file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 20px; }
.file-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px;
  cursor: pointer; transition: all 0.2s;
}
.file-card:hover { border-color: var(--primary); transform: translateY(-1px); }
.file-card.active { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.file-card.dirty { border-color: var(--warning); }
.file-card .file-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.file-card .file-desc { font-size: 12px; color: var(--muted); }
.file-card .file-status { font-size: 11px; margin-top: 8px; padding: 2px 8px; border-radius: 3px; display: inline-block; }
.file-status.loaded { background: rgba(76,175,80,0.15); color: var(--success); }
.file-status.error { background: rgba(244,67,54,0.15); color: var(--danger); }
.file-status.pending { background: rgba(255,152,0,0.15); color: var(--warning); }
.file-status.dirty { background: rgba(255,152,0,0.25); color: var(--warning); }

/* 编辑器区域 */
.editor-section { display: none; }
.editor-section.visible { display: block; }
.editor-toolbar {
  background: var(--card); border: 1px solid var(--border); border-bottom: none; border-radius: 8px 8px 0 0;
  padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
}
.editor-toolbar .file-title { font-size: 15px; font-weight: 600; }
.editor-toolbar .file-path { font-size: 12px; color: var(--muted); font-weight: normal; }
.editor-actions { display: flex; gap: 6px; }
.editor-wrapper {
  border: 1px solid var(--border); border-radius: 0 0 8px 8px; overflow: hidden; margin-bottom: 20px;
}
.editor-wrapper textarea {
  width: 100%; min-height: 400px; background: #0d1117; color: #c9d1d9; font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
  font-size: 13px; line-height: 1.6; padding: 16px; border: none; resize: vertical; tab-size: 2;
}
.editor-wrapper textarea:focus { outline: none; }
.editor-info {
  background: var(--card); padding: 8px 16px; font-size: 12px; color: var(--muted);
  border-top: 1px solid var(--border); display: flex; justify-content: space-between;
}

/* 规则管理 */
.rule-manager {
  background: var(--card); border: 1px solid var(--border); border-bottom: none;
  padding: 14px 16px; display: none;
}
.rule-manager.visible { display: block; }
.rule-manager-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.rule-manager-header strong { font-size: 14px; }
.rule-manager-header span { font-size: 12px; color: var(--muted); }
.rule-add-row { display: grid; grid-template-columns: 160px minmax(180px, 1fr) 160px auto; gap: 8px; margin-bottom: 10px; }
.rule-add-row select,
.rule-add-row input,
.rule-filter-input {
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  padding: 7px 10px; border-radius: 4px; font-size: 13px;
}
.rule-add-row select:focus,
.rule-add-row input:focus,
.rule-filter-input:focus { outline: none; border-color: var(--primary); }
.rule-filter-input { width: 100%; margin-bottom: 10px; }
.rule-list { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; }
.rule-item {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
}
.rule-text { min-width: 0; font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; font-size: 12px; word-break: break-all; }
.rule-type { color: var(--success); font-weight: 600; }
.rule-value { color: var(--text); }
.rule-option { color: var(--warning); }
.rule-empty { color: var(--muted); font-size: 13px; padding: 12px; text-align: center; border: 1px dashed var(--border); border-radius: 6px; }
.rule-error { color: var(--warning); font-size: 13px; padding: 12px; background: rgba(255,152,0,0.1); border-radius: 6px; }
.file-type-tag { font-size: 11px; margin-left: 6px; color: var(--muted); font-weight: normal; }

/* 提交面板 */
.commit-panel {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 20px;
  display: none;
}
.commit-panel.visible { display: block; }
.commit-panel h3 { font-size: 14px; margin-bottom: 8px; }
.commit-panel .dirty-count { font-size: 12px; color: var(--warning); font-weight: normal; margin-left: 8px; }
.commit-input {
  width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
  padding: 8px 12px; border-radius: 4px; font-size: 13px; margin-bottom: 10px;
}
.commit-input:focus { outline: none; border-color: var(--primary); }
.commit-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* 批量提交文件列表 */
.commit-file-list {
  background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
  margin-bottom: 10px; max-height: 240px; overflow-y: auto;
}
.commit-file-item {
  padding: 8px 12px; font-size: 13px; display: flex;
  justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--border);
}
.commit-file-item:last-child { border-bottom: none; }
.commit-file-item .file-label { color: var(--text); }
.commit-file-item .file-status-label { color: var(--warning); font-size: 12px; }
.commit-progress {
  margin-bottom: 10px; display: none;
}
.commit-progress.visible { display: block; }
.commit-progress-bar {
  background: var(--bg); border-radius: 4px; height: 6px; overflow: hidden; margin-bottom: 6px;
}
.commit-progress-fill {
  background: var(--success); height: 100%; width: 0%; transition: width 0.3s;
}
.commit-progress-text { font-size: 12px; color: var(--muted); }

/* 状态消息 */
.toast {
  position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 6px; font-size: 13px;
  z-index: 9999; transform: translateX(120%); transition: transform 0.3s; max-width: 400px;
}
.toast.show { transform: translateX(0); }
.toast.success { background: var(--success); color: #fff; }
.toast.error { background: var(--danger); color: #fff; }
.toast.info { background: var(--accent); color: #fff; }

/* 加载 */
.loading { text-align: center; padding: 40px; color: var(--muted); }
.spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 模态框 */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9998; display: none; }
.modal-overlay.show { display: flex; align-items: center; justify-content: center; }
.modal { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 500px; width: 90%; }
.modal h3 { font-size: 16px; margin-bottom: 12px; }
.modal p { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* 响应式 */
@media (max-width: 640px) {
  .container { padding: 12px; }
  header { padding: 12px 16px; }
  header h1 { font-size: 17px; }
  .file-grid { grid-template-columns: 1fr; }
  .editor-wrapper textarea { min-height: 300px; }
  .settings-row input { min-width: 120px; }
  .editor-toolbar { flex-direction: column; align-items: flex-start; }
  .rule-add-row { grid-template-columns: 1fr; }
  .rule-item { align-items: flex-start; flex-direction: column; }
}

.diff-content { background: #0d1117; border: 1px solid var(--border); border-radius: 4px; padding: 12px; font-family: monospace; font-size: 12px; line-height: 1.5; margin-top: 8px; max-height: 300px; overflow-y: auto; }
.diff-added { color: #7ee787; }
.diff-removed { color: #f85149; }

/* INI 管理面板 */
.ini-manager {
  background: var(--card); border: 1px solid var(--border); border-bottom: none;
  padding: 0; display: none;
}
.ini-manager.visible { display: block; }
.ini-tabs {
  display: flex; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.15);
}
.ini-tab {
  padding: 10px 20px; border: none; background: none; color: var(--muted); cursor: pointer;
  font-size: 13px; font-weight: 500; transition: all 0.2s; border-bottom: 2px solid transparent;
}
.ini-tab:hover { color: var(--text); }
.ini-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.ini-tab-content { display: none; padding: 14px 16px; }
.ini-tab-content.active { display: block; }
.ini-section-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px;
}
.ini-section-header strong { font-size: 14px; }
.ini-section-header span { color: var(--muted); font-size: 12px; }
.ini-search-row { display: flex; gap: 8px; margin-bottom: 10px; }
.ini-search-input {
  flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
  padding: 7px 10px; border-radius: 4px; font-size: 13px;
}
.ini-search-input:focus { outline: none; border-color: var(--primary); }
.ini-list { display: flex; flex-direction: column; gap: 6px; }
.ini-ruleset-item {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
}
.ini-ruleset-info { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; flex: 1; }
.ini-ruleset-name { font-weight: 600; font-size: 13px; color: var(--text); }
.ini-ruleset-format {
  font-size: 11px; background: rgba(233,69,96,0.15); color: var(--primary);
  padding: 1px 6px; border-radius: 3px;
}
.ini-ruleset-url { font-size: 12px; color: var(--muted); word-break: break-all; min-width: 0; }
.ini-group-card {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 0; overflow: hidden;
}
.ini-group-header {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}
.ini-group-name { font-weight: 600; font-size: 13px; flex: 1; }
.ini-group-type-badge {
  font-size: 11px; background: rgba(76,175,80,0.15); color: var(--success);
  padding: 1px 6px; border-radius: 3px;
}
.ini-group-preview {
  padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px;
}
.ini-group-detail { color: var(--muted); }
.ini-group-form { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.ini-form-row { display: flex; align-items: center; gap: 8px; }
.ini-form-row label { font-size: 12px; color: var(--muted); min-width: 80px; flex-shrink: 0; }
.ini-input {
  flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
  padding: 6px 10px; border-radius: 4px; font-size: 13px;
}
.ini-input:focus { outline: none; border-color: var(--primary); }
.ini-form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.ini-form-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; }
.ini-chip-list { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
.ini-chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(15,52,96,0.5); border: 1px solid var(--border); border-radius: 12px;
  padding: 2px 10px; font-size: 12px; color: var(--text);
}
.ini-chip-removable { padding-right: 4px; }
.ini-chip-remove {
  cursor: pointer; color: var(--danger); font-size: 14px; line-height: 1; margin-left: 2px;
  opacity: 0.7;
}
.ini-chip-remove:hover { opacity: 1; }
.ini-add-chip-row { display: flex; gap: 6px; margin-left: 88px; }

/* 全局搜索 */
.global-search-wrapper { display: flex; gap: 8px; align-items: center; flex: 1; min-width: 180px; max-width: 380px; position: relative; }
.global-search-wrapper input {
  flex: 1; background: var(--accent); border: 1px solid var(--border); color: var(--text);
  padding: 6px 12px; border-radius: 4px; font-size: 13px;
}
.global-search-wrapper input:focus { outline: none; border-color: var(--primary); }
.global-search-wrapper input::placeholder { color: var(--muted); }
.search-result-file { font-weight: 600; color: var(--primary); margin: 10px 0 4px; font-size: 13px; }
.search-result-match {
  padding: 3px 6px; font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 12px;
  cursor: pointer; border-radius: 3px; display: flex; gap: 8px; align-items: baseline;
}
.search-result-match:hover { background: rgba(233,69,96,0.1); }
.search-result-line { color: var(--muted); min-width: 40px; text-align: right; user-select: none; }
.search-result-text { color: var(--text); word-break: break-all; }
.search-result-highlight { color: var(--warning); font-weight: 600; }
.drag-handle { cursor: grab; color: var(--muted); font-size: 16px; user-select: none; padding: 0 4px; }
.drag-handle:active { cursor: grabbing; }
.ini-ruleset-item[draggable="true"] { cursor: grab; }
.ini-ruleset-item[draggable="true"]:active { cursor: grabbing; }
.ini-ruleset-item.dragging, .ini-group-card.dragging, .ini-chip.dragging { opacity: 0.4; }
.ini-ruleset-item.drag-over, .ini-group-card.drag-over { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.ini-chip.drag-over { border-color: var(--primary); background: rgba(233,69,96,0.2); }

@media (max-width: 640px) {
  .ini-form-grid { grid-template-columns: 1fr; }
  .ini-form-row { flex-direction: column; align-items: flex-start; }
  .ini-add-chip-row { margin-left: 0; }
}
</style>
</head>
<body>

<header>
  <h1>⚡ Clash 规则编辑器 <small>在线编辑 · 一键推送</small></h1>
  <div class="global-search-wrapper">
    <input id="globalSearchInput" placeholder="🔍 搜索所有规则..." oninput="debouncedGlobalSearch()">
  </div>
  <div class="header-actions">
    <button class="btn btn-success" id="batchPushBtn" onclick="showBatchCommit()">📤 全部推送</button>
    <button class="btn btn-outline" onclick="refreshAllFiles()">🔄 刷新</button>
    <button class="btn btn-outline" onclick="showSettings()">⚙️ 设置</button>
  </div>
</header>

<div class="container">

  <!-- 设置面板 -->
  <div class="settings-panel" id="settingsPanel" style="display:none">
    <h2>⚙️ GitHub 设置</h2>
    <div class="settings-row">
      <label>Token</label>
      <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx" value="">
      <label>仓库</label>
      <input type="text" id="repoInput" placeholder="用户名/仓库名" value="">
      <label>分支</label>
      <input type="text" id="branchInput" placeholder="main" value="main">
      <button class="btn btn-success btn-sm" onclick="saveSettings()">保存</button>
    </div>
  </div>

  <!-- 文件列表 -->
  <div id="fileList" class="file-grid"></div>

  <!-- 编辑器 -->
  <div class="editor-section" id="editorSection">
    <div class="editor-toolbar">
      <div>
        <span class="file-title" id="editorTitle">文件名</span>
        <span class="file-path" id="editorPath">路径</span>
      </div>
      <div class="editor-actions">
        <button class="btn btn-warning btn-sm" onclick="showDiff()">📝 对比</button>
        <button class="btn btn-primary btn-sm" onclick="saveFile()">💾 存到本地</button>
      </div>
    </div>
    <div class="rule-manager" id="ruleManager">
      <div class="rule-manager-header">
        <strong>🧩 可视化规则管理</strong>
        <span id="ruleCount">0 条规则</span>
      </div>
      <div class="rule-add-row">
        <select id="ruleTypeInput" title="规则类型">
          <option value="DOMAIN-SUFFIX">DOMAIN-SUFFIX</option>
          <option value="DOMAIN">DOMAIN</option>
          <option value="DOMAIN-KEYWORD">DOMAIN-KEYWORD</option>
          <option value="IP-CIDR">IP-CIDR</option>
          <option value="IP-CIDR6">IP-CIDR6</option>
          <option value="GEOIP">GEOIP</option>
          <option value="PROCESS-NAME">PROCESS-NAME</option>
          <option value="DOMAIN-WILDCARD">DOMAIN-WILDCARD</option>
          <option value="SRC-IP-CIDR">SRC-IP-CIDR</option>
          <option value="DST-PORT">DST-PORT</option>
          <option value="SRC-PORT">SRC-PORT</option>
        </select>
        <input id="ruleValueInput" placeholder="规则值，例如 example.com 或 1.2.3.4/32">
        <input id="ruleOptionInput" placeholder="可选参数，例如 no-resolve">
        <button class="btn btn-success" onclick="addPayloadRule()">➕ 添加规则</button>
      </div>
      <input class="rule-filter-input" id="ruleFilterInput" placeholder="搜索规则，例如 github" oninput="filterPayloadRules()">
      <div class="rule-list" id="ruleList"></div>
    </div>
    <div class="ini-manager" id="iniManager">
      <div class="ini-tabs">
        <button class="ini-tab active" data-tab="rulesets" onclick="switchIniTab('rulesets')">📋 规则集</button>
        <button class="ini-tab" data-tab="groups" onclick="switchIniTab('groups')">🎯 策略组</button>
      </div>
      <div class="ini-tab-content active" id="iniRulesetsTab">
        <div class="ini-section-header">
          <strong>规则集列表</strong>
          <span id="iniRulesetCount">0 条</span>
        </div>
        <div class="ini-search-row">
          <input class="ini-search-input" id="iniRulesetFilter" placeholder="搜索规则集..." oninput="renderIniRulesets()">
          <button class="btn btn-success btn-sm" onclick="showAddRulesetModal()">➕ 添加规则集</button>
        </div>
        <div class="ini-list" id="iniRulesetList"></div>
      </div>
      <div class="ini-tab-content" id="iniGroupsTab">
        <div class="ini-section-header">
          <strong>策略组列表</strong>
          <span id="iniGroupCount">0 个</span>
        </div>
        <div class="ini-list" id="iniGroupList"></div>
      </div>
    </div>
    <div class="editor-wrapper">
      <textarea id="editorContent" spellcheck="false"></textarea>
      <div class="editor-info">
        <span id="editorLines">行数: 0</span>
        <span id="editorSize">大小: 0 B</span>
      </div>
    </div>

    <!-- 提交面板 -->
    <div class="commit-panel" id="commitPanel">
      <h3>📤 推送至 GitHub <span class="dirty-count" id="dirtyCount"></span></h3>
      <input class="commit-input" id="commitMessage" placeholder="推送说明" value="更新规则">
      <div class="commit-progress" id="commitProgress">
        <div class="commit-progress-bar"><div class="commit-progress-fill" id="commitProgressFill"></div></div>
        <div class="commit-progress-text" id="commitProgressText"></div>
      </div>
      <div id="commitFileList" class="commit-file-list"></div>
      <div class="commit-actions">
        <button class="btn btn-success" id="commitAllBtn" onclick="commitAllFiles()">🚀 全部推送</button>
        <button class="btn btn-outline" onclick="hideCommitPanel()">取消</button>
      </div>
    </div>
  </div>

</div>

<!-- 模态框 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">标题</h3>
    <p id="modalBody">内容</p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============== 状态 ==============
const state = {
  token: '',
  repo: '',
  branch: 'main',
  files: [],
  currentFile: null,
  originalContent: '',
  originalContents: {}, // path -> 原始 GitHub 内容（用于 dirty 检测和 diff）
  ruleFilter: '',
  fileBuffers: {},   // path -> 当前编辑内容
  dirtyFiles: {},    // path -> true（已修改未推送）
};

// 从 localStorage 恢复设置
try {
  const saved = JSON.parse(localStorage.getItem('clash-editor-settings') || '{}');
  state.token = saved.token || '';
  state.repo = saved.repo || 'xyysjd/ClashRule';
  state.branch = saved.branch || 'main';
} catch(e) {}

// ============== 文件清单 ==============
const FILE_LIST = [
  { name: 'GeneralClashRule.ini', path: 'GeneralClashRule.ini', desc: '主规则配置文件（分组、代理策略）', type: 'ini' },
  { name: 'guonei.yaml', path: 'guonei.yaml', desc: '国内流量规则', type: 'yaml-payload' },
  { name: 'guowai.yaml', path: 'guowai.yaml', desc: '国外流量规则', type: 'yaml-payload' },
  { name: 'Emby.yaml', path: 'Emby.yaml', desc: 'EMBY 规则', type: 'yaml-payload' },
  { name: 'zlemby.yaml', path: 'zlemby.yaml', desc: '直连 EMBY 规则', type: 'yaml-payload' },
  { name: 'trakt.yaml', path: 'trakt.yaml', desc: 'Trakt 规则', type: 'yaml-payload' },
];

function isYamlPayloadFile(fileMeta) {
  return fileMeta && fileMeta.type === 'yaml-payload';
}

function isIniFile(fileMeta) {
  return fileMeta && fileMeta.type === 'ini';
}

// ============== API 工具 ==============
async function ghApi(path, method, body) {
  method = method || 'GET';
  const headers = {
    'Authorization': 'token ' + state.token,
    'Accept': 'application/vnd.github.v3+json',
  };
  if (body) {
    headers['Content-Type'] = 'application/json';
  }
  // 请求仓库根信息时 path 可能是空字符串，直接用仓库 API
  var url;
  if (!path || path === '') {
    url = 'https://api.github.com/repos/' + state.repo;
  } else {
    url = 'https://api.github.com/repos/' + state.repo + '/' + path;
  }
  // 去掉路径末尾多余的 /
  if (url.endsWith('/')) url = url.slice(0, -1);
  const res = await fetch(url, { method: method, headers: headers, body: body ? JSON.stringify(body) : null });
  if (!res.ok) {
    // 尝试读取详细的错误信息
    try {
      const err = await res.json();
      throw new Error(err.message + ' (HTTP ' + res.status + ')');
    } catch(parseErr) {
      if (parseErr instanceof Error && parseErr.message !== res.statusText) throw parseErr;
      throw new Error('HTTP ' + res.status + ' ' + res.statusText);
    }
  }
  return res.json();
}

/** UTF-8 安全的 base64 解码 */
function base64Decode(str) {
  var binary = atob(str);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return new TextDecoder('utf-8').decode(bytes);
}

/** UTF-8 安全的 base64 编码 */
function base64Encode(str) {
  var bytes = new TextEncoder().encode(str);
  var binary = '';
  for (var i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary);
}

// 获取文件 SHA 和内容
async function getFileSha(filePath) {
  try {
    const data = await ghApi('contents/' + filePath);
    return { sha: data.sha, content: base64Decode(data.content) };
  } catch(e) {
    if (e.message.indexOf('404') >= 0 || e.message.indexOf('Not Found') >= 0) {
      return { sha: null, content: '' };
    }
    throw e;
  }
}

// ============== 界面函数 ==============

function showToast(msg, type) {
  type = type || 'info';
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}

function showModal(title, body) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').textContent = body;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function showSettings() {
  var panel = document.getElementById('settingsPanel');
  if (panel.style.display === 'none' || panel.style.display === '') {
    document.getElementById('tokenInput').value = state.token;
    document.getElementById('repoInput').value = state.repo;
    document.getElementById('branchInput').value = state.branch;
    panel.style.display = 'block';
  } else {
    panel.style.display = 'none';
  }
}

function saveSettings() {
  state.token = document.getElementById('tokenInput').value.trim();
  state.repo = document.getElementById('repoInput').value.trim();
  state.branch = document.getElementById('branchInput').value.trim() || 'main';
  localStorage.setItem('clash-editor-settings', JSON.stringify({
    token: state.token, repo: state.repo, branch: state.branch,
  }));
  document.getElementById('settingsPanel').style.display = 'none';
  showToast('设置已保存', 'success');
  refreshAllFiles();
}

function getDirtyCount() {
  return Object.keys(state.dirtyFiles).length;
}

function updateBatchPushButton() {
  var btn = document.getElementById('batchPushBtn');
  var count = getDirtyCount();
  btn.textContent = count > 0 ? '📤 全部推送 (' + count + ')' : '📤 全部推送';
  btn.disabled = count === 0;
}

function renderFileList() {
  var container = document.getElementById('fileList');
  var html = '';
  for (var i = 0; i < FILE_LIST.length; i++) {
    var f = FILE_LIST[i];
    var file = null;
    for (var j = 0; j < state.files.length; j++) {
      if (state.files[j].path === f.path) { file = state.files[j]; break; }
    }
    var isDirty = !!state.dirtyFiles[f.path];
    var status = '';
    var statusText = '';
    if (isDirty) {
      status = 'dirty';
      statusText = '已修改（待推送）';
    } else if (file) {
      status = file.error ? 'error' : 'loaded';
      statusText = file.error ? '加载失败' : '已加载';
    } else {
      status = 'pending';
      statusText = '待加载';
    }
    var isActive = state.currentFile && state.currentFile.path === f.path;
    var cardClass = 'file-card' + (isActive ? ' active' : '') + (isDirty ? ' dirty' : '');
    html += '<div class="' + cardClass + '" onclick="selectFile(\'' + f.path + '\')">' +
      '<div class="file-name">📄 ' + f.name + (isIniFile(f) ? '<span class="file-type-tag">INI 管理</span>' : isYamlPayloadFile(f) ? '<span class="file-type-tag">规则管理</span>' : '') + '</div>' +
      '<div class="file-desc">' + f.desc + '</div>' +
      '<span class="file-status ' + status + '">' + statusText + '</span></div>';
  }
  container.innerHTML = html;
}

async function refreshAllFiles() {
  showToast('正在连接 GitHub...', 'info');
  try {
    // 验证 token 和仓库是否可访问
    const repoData = await ghApi('');

    // 如果当前文件已加载且没有未推送修改，则重新从远端拉取内容
    if (state.currentFile && state.originalContents[state.currentFile.path] !== undefined && !state.dirtyFiles[state.currentFile.path]) {
      try {
        var curPath = state.currentFile.path;
        const result = await getFileSha(curPath);
        state.originalContents[curPath] = result.content;
        state.fileBuffers[curPath] = result.content;
        state.currentFile.sha = result.sha;
        state.originalContent = result.content;
        document.getElementById('editorContent').value = result.content;
        updateEditorInfo();
        renderRuleManager();
        renderFileList();
        updateBatchPushButton();
      } catch(reloadErr) {
        // 重新加载失败不阻塞整体刷新提示
        showToast('重新加载当前文件失败: ' + reloadErr.message, 'error');
      }
    } else {
      if (!state.currentFile) {
        document.getElementById('editorSection').classList.remove('visible');
      }
      renderRuleManager();
      renderFileList();
      updateBatchPushButton();
    }
    showToast('已连接: ' + repoData.full_name, 'success');
  } catch(e) {
    var msg = e.message;
    if (msg.indexOf('401') >= 0) {
      msg = 'Token 无效或已过期，请检查 ⚙️ 设置中的 Token';
    } else if (msg.indexOf('403') >= 0) {
      msg = 'Token 权限不足或 API 频率限制，请检查 Token 权限（需要 repo 权限）';
    } else if (msg.indexOf('404') >= 0) {
      msg = '仓库不存在，请检查 ⚙️ 设置中的仓库名';
    } else if (msg.indexOf('Failed to fetch') >= 0 || msg.indexOf('NetworkError') >= 0) {
      msg = '网络请求失败，可能是 CORS 或网络问题。如果你是第一次使用，请确认 Token 未被 GitHub 撤销（之前推送时被检测到泄露可能已被自动撤销），建议重新生成一个新 Token';
    }
    showToast('连接失败: ' + msg, 'error');
  }
}

async function selectFile(filePath) {
  var fileMeta = null;
  for (var i = 0; i < FILE_LIST.length; i++) {
    if (FILE_LIST[i].path === filePath) { fileMeta = FILE_LIST[i]; break; }
  }
  if (!fileMeta) return;

  // ====== 自动保存当前文件到缓冲区 ======
  if (state.currentFile) {
    var currentContent = document.getElementById('editorContent').value;
    var currentPath = state.currentFile.path;
    state.fileBuffers[currentPath] = currentContent;
    // 对比原始 GitHub 内容，而非 originalContent（可能已被缓冲区覆盖）
    if (currentContent !== state.originalContents[currentPath]) {
      state.dirtyFiles[currentPath] = true;
    } else {
      delete state.dirtyFiles[currentPath];
    }
  }

  document.getElementById('editorTitle').textContent = fileMeta.name;
  document.getElementById('editorPath').textContent = filePath;
  document.getElementById('editorSection').classList.add('visible');
  document.getElementById('commitPanel').classList.remove('visible');
  updateBatchPushButton();

  // ====== 如果缓冲区有内容，直接从缓冲区加载（不发起网络请求） ======
  if (state.fileBuffers[filePath] !== undefined) {
    state.currentFile = { path: filePath, sha: null, meta: fileMeta };
    state.originalContent = state.fileBuffers[filePath];
    document.getElementById('editorContent').value = state.fileBuffers[filePath];
    document.getElementById('editorContent').disabled = false;
    updateEditorInfo();
    renderRuleManager();
    renderFileList();
    return;
  }

  // 请求序号：防止快速切换文件时旧请求覆盖新内容
  if (!state._fileSeq) state._fileSeq = 0;
  var mySeq = ++state._fileSeq;

  document.getElementById('editorContent').value = '加载中...';
  document.getElementById('editorContent').disabled = true;

  try {
    const result = await getFileSha(filePath);
    // 如果不是最新请求，丢弃结果
    if (mySeq !== state._fileSeq) return;
    state.currentFile = { path: filePath, sha: result.sha, meta: fileMeta };
    state.originalContent = result.content;
    state.originalContents[filePath] = result.content;
    state.fileBuffers[filePath] = result.content;

    // 更新文件状态
    var found = false;
    for (var idx = 0; idx < state.files.length; idx++) {
      if (state.files[idx].path === filePath) {
        state.files[idx] = { path: filePath, meta: fileMeta, loaded: true, error: false };
        found = true; break;
      }
    }
    if (!found) state.files.push({ path: filePath, meta: fileMeta, loaded: true, error: false });

    document.getElementById('editorContent').value = result.content;
    document.getElementById('editorContent').disabled = false;
    updateEditorInfo();
    renderRuleManager();
    renderFileList();
  } catch(e) {
    showToast('加载 ' + filePath + ' 失败: ' + e.message, 'error');
    var found2 = false;
    for (var idx2 = 0; idx2 < state.files.length; idx2++) {
      if (state.files[idx2].path === filePath) {
        state.files[idx2] = { path: filePath, meta: fileMeta, loaded: false, error: true };
        found2 = true; break;
      }
    }
    if (!found2) state.files.push({ path: filePath, meta: fileMeta, loaded: false, error: true });
    document.getElementById('editorContent').value = '';
    document.getElementById('editorContent').disabled = false;
    renderRuleManager();
    renderFileList();
  }
}

function updateEditorInfo() {
  var text = document.getElementById('editorContent').value;
  var lines = text.split(/\n/).length - 1;
  document.getElementById('editorLines').textContent = '行数: ' + lines;
  var size = text.length;
  document.getElementById('editorSize').textContent = '大小: ' + (size >= 1024 ? (size/1024).toFixed(1) + ' KB' : size + ' B');
}

// 自动从编辑器同步到缓冲区
function syncCurrentEditorToBuffer() {
  if (!state.currentFile) return;
  var content = document.getElementById('editorContent').value;
  var path = state.currentFile.path;
  state.fileBuffers[path] = content;
  if (content !== state.originalContents[path]) {
    state.dirtyFiles[path] = true;
  } else {
    delete state.dirtyFiles[path];
  }
  renderFileList();
  updateBatchPushButton();
}

// 输入事件：实时同步缓冲区 + 防抖渲染可视化面板
var _renderTimer = null;
document.getElementById('editorContent').addEventListener('input', function() {
  updateEditorInfo();
  syncCurrentEditorToBuffer();
  if (_renderTimer) clearTimeout(_renderTimer);
  _renderTimer = setTimeout(renderRuleManager, 200);
});

// 离页保护：有未推送修改时阻止意外离开
window.addEventListener('beforeunload', function(e) {
  if (getDirtyCount() > 0) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// 保存当前文件到缓冲区（仅在本地，不推送至 GitHub）
function saveFile() {
  if (!state.currentFile) return;
  var content = document.getElementById('editorContent').value;
  var path = state.currentFile.path;
  state.fileBuffers[path] = content;
  if (content !== state.originalContents[path]) {
    state.dirtyFiles[path] = true;
    showToast('✅ ' + state.currentFile.meta.name + ' 已保存（存到本地，还需点 📤 全部推送 才会上传 GitHub）', 'success');
  } else {
    delete state.dirtyFiles[path];
    showToast('内容未改变', 'info');
  }
  renderFileList();
  updateBatchPushButton();
}

function hideCommitPanel() {
  document.getElementById('commitPanel').classList.remove('visible');
  document.getElementById('commitProgress').classList.remove('visible');
}

function showBatchCommit() {
  var count = getDirtyCount();
  if (count === 0) {
    showToast('没有需要提交的文件', 'info');
    return;
  }
  // 先自动保存当前编辑器内容
  if (state.currentFile) {
    var content = document.getElementById('editorContent').value;
    var path = state.currentFile.path;
    state.fileBuffers[path] = content;
    if (content !== state.originalContents[path]) {
      state.dirtyFiles[path] = true;
    } else {
      delete state.dirtyFiles[path];
    }
    renderFileList();
    updateBatchPushButton();
  }
  // 重新统计（可能刚才有变化）
  count = getDirtyCount();
  if (count === 0) {
    showToast('没有需要提交的文件', 'info');
    return;
  }
  document.getElementById('dirtyCount').textContent = count + ' 个文件待推送';
  // 渲染待提交文件列表
  var listHtml = '';
  for (var i = 0; i < FILE_LIST.length; i++) {
    var f = FILE_LIST[i];
    if (state.dirtyFiles[f.path]) {
      listHtml += '<div class="commit-file-item">' +
        '<span class="file-label">📄 ' + f.name + '</span>' +
        '<span class="file-status-label">已修改</span></div>';
    }
  }
  document.getElementById('commitFileList').innerHTML = listHtml;
  document.getElementById('commitMessage').value = '更新规则';
  document.getElementById('commitProgress').classList.remove('visible');
  document.getElementById('commitAllBtn').disabled = false;
  document.getElementById('commitAllBtn').textContent = '🚀 全部推送';
  document.getElementById('commitPanel').classList.add('visible');
}

async function commitAllFiles() {
  var message = document.getElementById('commitMessage').value.trim() || '更新规则';
  var btn = document.getElementById('commitAllBtn');
  var progress = document.getElementById('commitProgress');
  var fill = document.getElementById('commitProgressFill');
  var text = document.getElementById('commitProgressText');

  btn.disabled = true;
  btn.textContent = '⏳ 提交中...';
  progress.classList.add('visible');

  // 收集所有待推送文件
  var fileEntries = [];
  for (var i = 0; i < FILE_LIST.length; i++) {
    if (state.dirtyFiles[FILE_LIST[i].path]) {
      var content = state.fileBuffers[FILE_LIST[i].path];
      if (content === undefined) continue;
      fileEntries.push({ path: FILE_LIST[i].path, name: FILE_LIST[i].name, content: content });
    }
  }
  var total = fileEntries.length;
  if (total === 0) {
    showToast('没有需要提交的文件', 'info');
    btn.disabled = false;
    btn.textContent = '🚀 全部推送';
    return;
  }

  text.textContent = '正在准备提交，共 ' + total + ' 个文件...';
  fill.style.width = '20%';

  try {
    // 1. 获取当前分支的最新 commit
    var refData = await ghApi('git/refs/heads/' + state.branch);
    var latestCommitSha = refData.object.sha;

    // 2. 获取当前 commit 的 tree SHA
    var commitData = await ghApi('git/commits/' + latestCommitSha);
    var baseTreeSha = commitData.tree.sha;

    // 3. 为每个修改的文件创建 blob
    var treeEntries = [];
    for (var idx = 0; idx < fileEntries.length; idx++) {
      var entry = fileEntries[idx];
      text.textContent = '正在处理 ' + (idx + 1) + '/' + total + '：' + entry.name + '...';
      fill.style.width = (20 + (idx / total) * 40) + '%';

      var blobData = await ghApi('git/blobs', 'POST', {
        content: entry.content,
        encoding: 'utf-8',
      });
      treeEntries.push({
        path: entry.path,
        mode: '100644',
        type: 'blob',
        sha: blobData.sha,
      });
    }

    // 4. 创建新 tree（基于 base tree + 修改的文件）
    text.textContent = '正在创建提交树...';
    fill.style.width = '65%';
    var newTreeData = await ghApi('git/trees', 'POST', {
      base_tree: baseTreeSha,
      tree: treeEntries,
    });

    // 5. 创建 commit
    text.textContent = '正在创建提交...';
    fill.style.width = '80%';
    var newCommitData = await ghApi('git/commits', 'POST', {
      message: message,
      tree: newTreeData.sha,
      parents: [latestCommitSha],
    });

    // 6. 更新分支引用
    text.textContent = '正在更新分支引用...';
    fill.style.width = '90%';
    await ghApi('git/refs/heads/' + state.branch, 'PATCH', {
      sha: newCommitData.sha,
      force: false,
    });

    // 标记所有文件为已推送
    for (var j = 0; j < fileEntries.length; j++) {
      var fp = fileEntries[j].path;
      delete state.dirtyFiles[fp];
      state.originalContents[fp] = fileEntries[j].content;
    }
    if (state.currentFile) {
      state.originalContent = state.originalContents[state.currentFile.path] || '';
      state.currentFile.sha = null;
    }

    fill.style.width = '100%';
    text.textContent = '✅ 全部 ' + total + ' 个文件已合并推送（1 次提交）';
    showToast('✅ 全部 ' + total + ' 个文件推送成功（1 次提交）', 'success');
    renderFileList();
    updateBatchPushButton();
    renderRuleManager();
    document.getElementById('commitPanel').classList.remove('visible');
  } catch(e) {
    fill.style.width = '100%';
    text.textContent = '❌ 推送失败';
    showToast('❌ 推送失败: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = '🚀 重试推送';
    document.getElementById('commitFileList').innerHTML =
      '<div class="commit-file-item"><span class="file-label" style="color:var(--danger)">❌ ' + escapeHtml(e.message) + '</span></div>';
  }
}

function escapeHtml(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function parsePayloadYaml(content) {
  var lines = content.split(/\r?\n/);
  var payloadIndex = -1;
  for (var i = 0; i < lines.length; i++) {
    if (lines[i].trim() === 'payload:') {
      payloadIndex = i;
      break;
    }
  }
  if (payloadIndex < 0) {
    return { valid: false, error: '未找到 payload:，请使用文本编辑器修改', headerLines: lines, rules: [] };
  }

  var parsed = {
    valid: true,
    error: '',
    headerLines: lines.slice(0, payloadIndex),
    rules: [],
  };

  for (var idx = payloadIndex + 1; idx < lines.length; idx++) {
    var line = lines[idx];
    if (!line.trim()) continue;
    if (line.trim().charAt(0) === '#') continue;

    var match = line.match(/^\s*-\s*(.+?)\s*$/);
    if (!match) {
      parsed.valid = false;
      parsed.error = '检测到无法识别的规则行：' + line;
      return parsed;
    }

    var raw = match[1].trim();
    var parts = raw.split(',');
    if (parts.length < 2) {
      parsed.valid = false;
      parsed.error = '规则格式不完整：' + raw;
      return parsed;
    }

    var type = parts.shift().trim();
    var value = parts.shift().trim();
    var option = parts.join(',').trim();
    parsed.rules.push({
      raw: buildRuleRaw(type, value, option),
      type: type,
      value: value,
      option: option,
      line: line,
    });
  }

  return parsed;
}

function serializePayloadYaml(parsed) {
  var lines = parsed.headerLines ? parsed.headerLines.slice() : [];
  while (lines.length && lines[lines.length - 1] === '') lines.pop();
  lines.push('payload:');
  for (var i = 0; i < parsed.rules.length; i++) {
    lines.push('  - ' + parsed.rules[i].raw);
  }
  return lines.join('\n') + '\n';
}

function buildRuleRaw(type, value, option) {
  var raw = type.trim().toUpperCase() + ',' + value.trim();
  option = (option || '').trim();
  if (option) raw += ',' + option;
  return raw;
}

// ============== INI 解析 ==============

function parseIniContent(text) {
  var result = {
    valid: true,
    error: '',
    meta: { enableRuleGenerator: true, overwriteOriginalRules: true },
    rulesets: [],
    groups: [],
    otherLines: [],
  };

  var lines = text.split(/\r?\n/);

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var trimmed = line.trim();

    if (trimmed === '' || trimmed.startsWith(';') || trimmed.startsWith('#') || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
      result.otherLines.push(line);
      continue;
    }

    if (trimmed.indexOf('enable_rule_generator=') >= 0) {
      result.meta.enableRuleGenerator = trimmed.split('=')[1].trim() === 'true';
      result.otherLines.push(line);
      continue;
    }

    if (trimmed.indexOf('overwrite_original_rules=') >= 0) {
      result.meta.overwriteOriginalRules = trimmed.split('=')[1].trim() === 'true';
      result.otherLines.push(line);
      continue;
    }

    if (trimmed.indexOf('ruleset=') === 0) {
      var rest = trimmed.substring(8);
      var commaIdx = rest.indexOf(',');
      if (commaIdx < 0) { result.otherLines.push(line); continue; }
      var name = rest.substring(0, commaIdx).trim();
      var urlPart = rest.substring(commaIdx + 1).trim();
      var format = '';
      var url = urlPart;
      // 检测 format:url 模式（如 clash-classic:https://...）
      var colonIdx = urlPart.indexOf(':');
      if (colonIdx > 0 && urlPart.indexOf('http://') !== 0 && urlPart.indexOf('https://') !== 0) {
        format = urlPart.substring(0, colonIdx).trim();
        url = urlPart.substring(colonIdx + 1).trim();
      }
      result.rulesets.push({
        name: name,
        format: format,
        url: url,
        isFinal: name === '[]FINAL' || url === '[]FINAL',
      });
      continue;
    }

    if (trimmed.indexOf('custom_proxy_group=') === 0) {
      var rest = trimmed.substring(19);
      var parts = rest.split('`');
      var group = {
        name: parts[0] || '',
        type: parts[1] || 'select',
        options: [],
        filter: '',
        testUrl: '',
        interval: '300',
        tolerance: '',
        failures: '',
      };

      if (group.type === 'select') {
        group.options = parts.slice(2);
      } else {
        group.filter = parts[2] || '';
        group.testUrl = parts[3] || '';
        group.interval = parts[4] || '300';
        group.tolerance = parts[5] || '';
        group.failures = parts[6] || '';
      }

      result.groups.push(group);
      continue;
    }

    result.otherLines.push(line);
  }

  return result;
}

function serializeIniContent(parsed) {
  var lines = [];
  var rulesetsDone = false;
  var groupsDone = false;

  for (var i = 0; i < parsed.otherLines.length; i++) {
    var line = parsed.otherLines[i];
    var trimmed = line.trim();

    if (trimmed === ';设置规则标志位' && !rulesetsDone) {
      lines.push(line);
      rulesetsDone = true;
      for (var r = 0; r < parsed.rulesets.length; r++) {
        var rs = parsed.rulesets[r];
        var parts = ['ruleset=' + rs.name];
        if (rs.format) {
          parts.push(rs.format + ':' + rs.url);
        } else if (rs.url) {
          parts.push(rs.url);
        }
        lines.push(parts.join(','));
      }
      continue;
    }

    if (trimmed === ';设置分组标志位' && !groupsDone) {
      lines.push(line);
      groupsDone = true;
      for (var g = 0; g < parsed.groups.length; g++) {
        var grp = parsed.groups[g];
        var gp = ['custom_proxy_group=' + grp.name, grp.type];
        if (grp.type === 'select') {
          gp = gp.concat(grp.options);
        } else {
          gp.push(grp.filter || '');
          gp.push(grp.testUrl || '');
          gp.push(grp.interval || '300');
          if (grp.tolerance) gp.push(grp.tolerance);
          if (grp.failures) gp.push(grp.failures);
        }
        lines.push(gp.join('`'));
      }
      continue;
    }

    lines.push(line);
  }

  if (!rulesetsDone && parsed.rulesets.length) {
    lines.push(';设置规则标志位');
    for (var r2 = 0; r2 < parsed.rulesets.length; r2++) {
      var rs2 = parsed.rulesets[r2];
      var parts2 = ['ruleset=' + rs2.name];
      if (rs2.format) {
        parts2.push(rs2.format + ':' + rs2.url);
      } else if (rs2.url) {
        parts2.push(rs2.url);
      }
      lines.push(parts2.join(','));
    }
  }

  if (!groupsDone && parsed.groups.length) {
    lines.push(';设置分组标志位');
    for (var g2 = 0; g2 < parsed.groups.length; g2++) {
      var grp2 = parsed.groups[g2];
      var gp2 = ['custom_proxy_group=' + grp2.name, grp2.type];
      if (grp2.type === 'select') {
        gp2 = gp2.concat(grp2.options);
      } else {
        gp2.push(grp2.filter || '');
        gp2.push(grp2.testUrl || '');
        gp2.push(grp2.interval || '300');
        if (grp2.tolerance) gp2.push(grp2.tolerance);
        if (grp2.failures) gp2.push(grp2.failures);
      }
      lines.push(gp2.join('`'));
    }
  }

  return lines.join('\n');
}

// ============== INI 管理交互 ==============

function switchIniTab(tab) {
  document.querySelectorAll('.ini-tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.ini-tab-content').forEach(function(c) { c.classList.remove('active'); });
  document.querySelector('.ini-tab[data-tab="' + tab + '"]').classList.add('active');
  document.getElementById('ini' + tab.charAt(0).toUpperCase() + tab.slice(1) + 'Tab').classList.add('active');
}

function getIniParsed() {
  return parseIniContent(document.getElementById('editorContent').value);
}

// 校验 INI 字段值是否包含结构分隔符
function validateIniField(label, value) {
  if (!value) return '';
  if (/[\r\n]/.test(value)) return label + '不能包含换行';
  // 策略组名/规则集名不能含反引号（custom_proxy_group 分隔符）
  if (/`/.test(value)) return label + '不能包含反引号 `';
  return '';
}

// 校验策略组选项内容
function validateIniOption(value) {
  if (!value) return '选项不能为空';
  if (/[\r\n]/.test(value)) return '选项不能包含换行';
  return '';
}

function syncIniToEditor(parsed) {
  var newContent = serializeIniContent(parsed);
  document.getElementById('editorContent').value = newContent;
  updateEditorInfo();
  renderIniManager();
  // 同步缓冲区状态，让「推送」按钮正确反映修改
  if (state.currentFile) {
    var path = state.currentFile.path;
    state.fileBuffers[path] = newContent;
    if (newContent !== state.originalContents[path]) {
      state.dirtyFiles[path] = true;
    } else {
      delete state.dirtyFiles[path];
    }
    renderFileList();
    updateBatchPushButton();
  }
}

function renderIniManager() {
  var manager = document.getElementById('iniManager');
  if (!manager) return;

  if (!state.currentFile || !isIniFile(state.currentFile.meta)) {
    manager.classList.remove('visible');
    return;
  }

  manager.classList.add('visible');
  renderIniRulesets();
  renderIniGroups();
  // 需要在 DOM 更新后绑定拖拽事件（setTimeout 确保渲染完成）
  setTimeout(enableIniDragDrop, 0);
}

function renderIniRulesets() {
  var list = document.getElementById('iniRulesetList');
  var count = document.getElementById('iniRulesetCount');
  if (!list || !count) return;

  var parsed = getIniParsed();
  if (!parsed.valid) {
    count.textContent = '格式异常';
    list.innerHTML = '<div class="rule-error">' + escapeHtml(parsed.error || 'INI 格式无法识别') + '</div>';
    return;
  }

  var filter = (document.getElementById('iniRulesetFilter').value || '').toLowerCase();
  var html = '';
  var shown = 0;

  for (var i = 0; i < parsed.rulesets.length; i++) {
    var rs = parsed.rulesets[i];
    if (filter && rs.name.toLowerCase().indexOf(filter) < 0 && rs.url.toLowerCase().indexOf(filter) < 0) continue;
    shown++;
    var formatBadge = rs.format ? '<span class="ini-ruleset-format">' + escapeHtml(rs.format) + '</span>' : '';
    var urlDisplay = rs.isFinal ? '<span style="color:var(--warning)">（本地兜底）</span>' : escapeHtml(rs.url);
    html += '<div class="ini-ruleset-item" draggable="true" data-index="' + i + '">' +
      '<div class="ini-ruleset-info">' +
      '<span class="drag-handle">⠿</span>' +
      '<span class="ini-ruleset-name">' + escapeHtml(rs.name) + '</span>' +
      formatBadge +
      '<span class="ini-ruleset-url">' + urlDisplay + '</span>' +
      '</div>' +
      '<div class="rule-actions">' +
      '<button class="btn btn-sm btn-outline" onclick="moveRuleset(' + i + ',-1)" title="上移">↑</button> ' +
      '<button class="btn btn-sm btn-outline" onclick="moveRuleset(' + i + ',1)" title="下移">↓</button> ' +
      '<button class="btn btn-warning btn-sm" onclick="editRuleset(' + i + ')">编辑</button> ' +
      '<button class="btn btn-danger btn-sm" onclick="deleteRuleset(' + i + ')">删除</button>' +
      '</div></div>';
  }

  count.textContent = parsed.rulesets.length + ' 条规则集' + (filter ? '，显示 ' + shown + ' 条' : '');
  if (!html) {
    html = '<div class="rule-empty">' + (parsed.rulesets.length ? '没有匹配的规则集' : '暂无规则集') + '</div>';
  }
  list.innerHTML = html;
}

function renderIniGroups() {

      '<input class="ini-input" id="iniGroupName' + i + '" value="' + escapeHtml(g.name) + '" onchange="updateIniGroup(' + i + ')" placeholder="策略组名称"></div>';

    html += '<div class="ini-form-row"><label>类型</label>' +

      '<option value="fallback"' + (g.type === 'fallback' ? ' selected' : '') + '>fallback（故障转移）</option>' +

        '<div class="ini-chip-list" id="iniGroupOptions' + i + '">';
      for (var oi = 0; oi < g.options.length; oi++) {
        var opt = g.options[oi];
        if (opt === '.*') {
          html += '<span class="ini-chip" draggable="true" data-optidx="' + oi + '" data-groupidx="' + i + '" style="border-color:var(--primary)">正则筛选: .*</span>';
          continue;
        }
        html += '<span class="ini-chip ini-chip-removable" draggable="true" data-optidx="' + oi + '" data-groupidx="' + i + '">' + escapeHtml(opt) +
          '<span class="ini-chip-remove" onclick="removeIniGroupOption(' + i + ',' + oi + ')">×</span></span>';
      }
      html += '</div></div>';
      html += '<div class="ini-add-chip-row">' +
        '<select class="ini-input" id="iniGroupOptSelect' + i + '" style="flex:0;min-width:auto;width:auto">' +
        '<option value="">自定义...</option><option value="[]DIRECT">[]DIRECT</option><option value="[]REJECT">[]REJECT</option><option value="[]PASS">[]PASS</option></select>' +
        '<input class="ini-input" id="iniGroupOptInput' + i + '" placeholder="选项（如 []手动选择 或 .*）" style="flex:1">' +
        '<button class="btn btn-sm btn-success" onclick="addIniGroupOption(' + i + ')">添加</button>' +
        '<button class="btn btn-sm btn-outline" onclick="moveIniGroup(' + i + ',-1)" title="上移">↑</button> ' +
        '<button class="btn btn-sm btn-outline" onclick="moveIniGroup(' + i + ',1)" title="下移">↓</button> ' +
        '<button class="btn btn-sm btn-outline" onclick="saveIniGroup(' + i + ')">保存</button>' +
        '<button class="btn btn-sm btn-danger" onclick="deleteIniGroup(' + i + ')">删除组</button>' +
        '</div>';
    } else {

      html += '<div class="ini-form-row"><label>正则筛选</label>' +
        '<input class="ini-input" id="iniGroupFilter' + i + '" value="' + escapeHtml(g.filter || '') + '" onchange="updateIniGroup(' + i + ')" placeholder="如 (🇭🇰|港|HK|Hong Kong)"></div>';
      html += '<div class="ini-form-grid">' +
        '<div class="ini-form-row"><label>测试 URL</label><input class="ini-input" id="iniGroupUrl' + i + '" value="' + escapeHtml(g.testUrl || '') + '" onchange="updateIniGroup(' + i + ')" placeholder="http://..."></div>' +
        '<div class="ini-form-row"><label>间隔</label><input class="ini-input" id="iniGroupInterval' + i + '" value="' + escapeHtml(g.interval || '300') + '" onchange="updateIniGroup(' + i + ')" placeholder="300"></div>' +
        '<div class="ini-form-row"><label>容差/失败</label><input class="ini-input" id="iniGroupExtra' + i + '" value="' + escapeHtml(g.tolerance + (g.failures ? ',' + g.failures : '')) + '" onchange="updateIniGroup(' + i + ')" placeholder=",50"></div>' +
        '</div>';

        '<button class="btn btn-sm btn-success" onclick="saveIniGroup(' + i + ')">保存</button>' +
        '<button class="btn btn-sm btn-outline" onclick="moveIniGroup(' + i + ',-1)" title="上移">↑</button> ' +
        '<button class="btn btn-sm btn-outline" onclick="moveIniGroup(' + i + ',1)" title="下移">↓</button> ' +
        '<button class="btn btn-sm btn-danger" onclick="deleteIniGroup(' + i + ')">删除组</button>' +

  html += '<div class="ini-group-card" style="border:1px dashed var(--border);padding:12px;margin-top:6px;">' +

    '<select class="ini-input" id="iniNewGroupType" style="flex:0;min-width:auto;width:auto">' +
    '<option value="select">select</option>' +
    '<option value="url-test">url-test</option>' +
    '<option value="fallback">fallback</option>' +
    '<option value="load-balance">load-balance</option></select>' +
    '<input class="ini-input" id="iniNewGroupName" placeholder="策略组名称，如 🚀 国外流量" style="flex:1">' +
    '<button class="btn btn-sm btn-success" onclick="addIniGroup()">➕ 添加</button></div></div>';

  count.textContent = parsed.groups.length + ' 个策略组';
  if (!html) {
    html = '<div class="rule-empty">暂无策略组，可在下方添加</div>';
  }
  list.innerHTML = html;
}

// ============== 拖拽排序 ==============

function enableIniDragDrop() {
  // 只在首次渲染时绑定一次拖拽事件，后续渲染跳过（容器元素未重建，监听器继续有效）
  if (window._iniDragBound) return;
  window._iniDragBound = true;
  var rsList = document.getElementById('iniRulesetList');
  if (rsList) {
    rsList.ondragstart = function(e) {
      var item = e.target.closest('.ini-ruleset-item');
      if (!item) { e.preventDefault(); return; }
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', item.getAttribute('data-index'));
      item.classList.add('dragging');
    };
    rsList.ondragend = function(e) {
      rsList.querySelectorAll('.ini-ruleset-item').forEach(function(el) {
        el.classList.remove('dragging', 'drag-over');
      });
    };
    rsList.ondragover = function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      var item = e.target.closest('.ini-ruleset-item');
      if (item) item.classList.add('drag-over');
    };
    rsList.ondragleave = function(e) {
      var item = e.target.closest('.ini-ruleset-item');
      if (item) item.classList.remove('drag-over');
    };
    rsList.ondrop = function(e) {
      e.preventDefault();
      var fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
      var toItem = e.target.closest('.ini-ruleset-item');
      if (!toItem) return;
      var toIdx = parseInt(toItem.getAttribute('data-index'));
      if (isNaN(fromIdx) || isNaN(toIdx) || fromIdx === toIdx) return;
      var parsed = getIniParsed();
      if (!parsed.valid) return;
      var item = parsed.rulesets.splice(fromIdx, 1)[0];
      parsed.rulesets.splice(toIdx, 0, item);
      syncIniToEditor(parsed);
    };
  }

  // 策略组拖拽（仅通过手柄）
  var grList = document.getElementById('iniGroupList');
  if (grList) {
    grList.addEventListener('dragstart', function(e) {
      var handle = e.target.closest('.drag-handle');
      if (!handle || !handle.draggable) { e.preventDefault(); return; }
      var card = handle.closest('.ini-group-card');
      if (!card) return;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', 'group:' + card.getAttribute('data-index'));
      card.classList.add('dragging');
    });
    grList.addEventListener('dragend', function(e) {
      grList.querySelectorAll('.ini-group-card').forEach(function(el) {
        el.classList.remove('dragging', 'drag-over');
      });
    });
    grList.addEventListener('dragover', function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      var card = e.target.closest('.ini-group-card');
      if (card) card.classList.add('drag-over');
    });
    grList.addEventListener('dragleave', function(e) {
      var card = e.target.closest('.ini-group-card');
      if (card) card.classList.remove('drag-over');
    });
    grList.addEventListener('drop', function(e) {
      e.preventDefault();
      var data = e.dataTransfer.getData('text/plain');
      if (!data || data.indexOf('group:') !== 0) return;
      var fromIdx = parseInt(data.substring(6));
      var toCard = e.target.closest('.ini-group-card');
      if (!toCard) return;
      var toIdx = parseInt(toCard.getAttribute('data-index'));
      if (isNaN(fromIdx) || isNaN(toIdx) || fromIdx === toIdx) return;
      var parsed = getIniParsed();
      if (!parsed.valid) return;
      var item = parsed.groups.splice(fromIdx, 1)[0];
      parsed.groups.splice(toIdx, 0, item);
      syncIniToEditor(parsed);
    });
  }

  // 选项 chip 拖拽（使用 mousedown 事件委托 + 全局 mousemove/mouseup）
  setupChipDrag();
}

// ============== Chip 模拟拖拽排序 ==============

var chipDragState = null;

function setupChipDrag() {
  var grList = document.getElementById('iniGroupList');
  if (!grList) return;

  // 只在 iniGroupList 上委托 mousedown，避免重复绑定
  if (!grList._chipDragSetup) {
    grList.addEventListener('mousedown', function(e) {
      if (e.button !== 0) return;
      var target = e.target.closest('.ini-chip-remove');
      if (target) return; // 删除按钮不触发拖拽
      var chip = e.target.closest('.ini-chip[draggable="true"]');
      if (!chip) return;
      chipDragState = {
        chip: chip,
        groupIdx: chip.getAttribute('data-groupidx'),
        optIdx: parseInt(chip.getAttribute('data-optidx')),
        startX: e.clientX,
        startY: e.clientY,
        moved: false,
      };
    });
    grList._chipDragSetup = true;
  }

  // 全局 mousemove/mouseup 只绑一次
  if (!document._chipDragGlobal) {
    document.addEventListener('mousemove', function(e) {
      if (!chipDragState) return;
      var dx = e.clientX - chipDragState.startX;
      var dy = e.clientY - chipDragState.startY;
      if (!chipDragState.moved && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
        chipDragState.moved = true;
        chipDragState.chip.style.opacity = '0.4';
        chipDragState.chip.style.position = 'relative';
        chipDragState.chip.style.zIndex = '999';
      }
      if (chipDragState.moved) {
        chipDragState.chip.style.left = dx + 'px';
        chipDragState.chip.style.top = dy + 'px';

        document.querySelectorAll('.ini-chip.drag-over').forEach(function(c) { c.classList.remove('drag-over'); });
        var el = document.elementFromPoint(e.clientX, e.clientY);
        if (el) {
          var targetChip = el.closest('.ini-chip[draggable="true"]');
          if (targetChip && targetChip !== chipDragState.chip) {
            targetChip.classList.add('drag-over');
          }
        }
      }
    });

    document.addEventListener('mouseup', function(e) {
      if (!chipDragState) return;
      if (chipDragState.chip) {
        chipDragState.chip.style.opacity = '';
        chipDragState.chip.style.position = '';
        chipDragState.chip.style.left = '';
        chipDragState.chip.style.top = '';
        chipDragState.chip.style.zIndex = '';
      }
      document.querySelectorAll('.ini-chip.drag-over').forEach(function(c) { c.classList.remove('drag-over'); });

      if (chipDragState.moved) {
        var el = document.elementFromPoint(e.clientX, e.clientY);
        if (el) {
          var targetChip = el.closest('.ini-chip[draggable="true"]');
          if (targetChip && targetChip !== chipDragState.chip) {
            var toGroupIdx = targetChip.getAttribute('data-groupidx');
            var toOptIdx = parseInt(targetChip.getAttribute('data-optidx'));
            if (chipDragState.groupIdx === toGroupIdx && !isNaN(chipDragState.optIdx) && !isNaN(toOptIdx)) {
              var parsed = getIniParsed();
              if (parsed.valid && parsed.groups[parseInt(chipDragState.groupIdx)]) {
                var gi = parseInt(chipDragState.groupIdx);
                var opt = parsed.groups[gi].options.splice(chipDragState.optIdx, 1)[0];
                parsed.groups[gi].options.splice(toOptIdx, 0, opt);
                syncIniToEditor(parsed);
              }
            }
          }
        }
      }
      chipDragState = null;
    });

    document._chipDragGlobal = true;
  }
}

function onIniGroupTypeChange(index) {
  var parsed = getIniParsed();
  if (!parsed.valid || !parsed.groups[index]) return;
  var newType = document.getElementById('iniGroupType' + index).value;
  var oldType = parsed.groups[index].type;

  if (oldType !== newType) {
    if (newType === 'select') {
      // 非 select → select：保留 filter 作为选项
      parsed.groups[index].options = parsed.groups[index].filter ? [parsed.groups[index].filter] : ['[]DIRECT'];
      parsed.groups[index].filter = '';
      parsed.groups[index].testUrl = '';
      parsed.groups[index].interval = '300';
      parsed.groups[index].tolerance = '';
      parsed.groups[index].failures = '';
    } else if (oldType === 'select') {
      // select → 非 select：保留第一个选项作为 filter
      parsed.groups[index].filter = parsed.groups[index].options.length > 0 ? parsed.groups[index].options[0] : '';
      parsed.groups[index].options = [];
      parsed.groups[index].testUrl = 'http://www.gstatic.com/generate_204';
      parsed.groups[index].interval = '300';
      parsed.groups[index].tolerance = '';
      parsed.groups[index].failures = '';
    }
    // 非 select ↔ 非 select（url-test/fallback/load-balance 互切）：保留所有参数不变
    parsed.groups[index].type = newType;
  }

  syncIniToEditor(parsed);
}

function validatePayloadRule(type, value, option) {
  type = (type || '').trim().toUpperCase();
  value = (value || '').trim();
  option = (option || '').trim();

  if (!type) return { ok: false, message: '规则类型不能为空' };
  if (!value) return { ok: false, message: '规则值不能为空' };
  if (/\r|\n/.test(type + value + option)) return { ok: false, message: '规则内容不能包含换行' };
  if (!/^[A-Z0-9-]+$/.test(type)) return { ok: false, message: '规则类型只能包含大写字母、数字和短横线' };

  var warning = '';
  if ((type === 'DOMAIN' || type === 'DOMAIN-SUFFIX' || type === 'DOMAIN-KEYWORD') && (/^https?:\/\//i.test(value) || value.indexOf('/') >= 0)) {
    warning = '域名规则通常不需要 http://、https:// 或路径';
  } else if ((type === 'IP-CIDR' || type === 'IP-CIDR6') && value.indexOf('/') < 0) {
    warning = 'CIDR 规则通常需要包含 / 掩码，例如 1.2.3.4/32';
  }

  return { ok: true, message: warning };
}

function renderRuleManager() {
  var manager = document.getElementById('ruleManager');
  var list = document.getElementById('ruleList');
  var count = document.getElementById('ruleCount');
  if (!manager || !list || !count) return;

  // 始终同步 INI 面板可见性（根据当前文件类型）
  var iniManager = document.getElementById('iniManager');
  if (iniManager) {
    if (state.currentFile && isIniFile(state.currentFile.meta)) {
      iniManager.classList.add('visible');
    } else {
      iniManager.classList.remove('visible');
    }
  }

  // 如果是 INI 文件，隐藏 YAML 规则管理并显示 INI 管理
  if (state.currentFile && isIniFile(state.currentFile.meta)) {
    manager.classList.remove('visible');
    list.innerHTML = '';
    count.textContent = '0 条规则';
    renderIniManager();
    return;
  }

  // YAML 规则管理（原有逻辑）
  if (!state.currentFile || !isYamlPayloadFile(state.currentFile.meta)) {
    manager.classList.remove('visible');
    list.innerHTML = '';
    count.textContent = '0 条规则';
    return;
  }

  manager.classList.add('visible');
  var parsed = parsePayloadYaml(document.getElementById('editorContent').value);
  if (!parsed.valid) {
    count.textContent = '格式无法识别';
    list.innerHTML = '<div class="rule-error">' + escapeHtml(parsed.error || '当前文件不是标准 payload 格式，请使用文本编辑器修改') + '</div>';
    return;
  }

  count.textContent = parsed.rules.length + ' 条规则';
  var filter = (state.ruleFilter || '').toLowerCase();
  var html = '';
  var shown = 0;
  for (var i = 0; i < parsed.rules.length; i++) {
    var rule = parsed.rules[i];
    if (filter && rule.raw.toLowerCase().indexOf(filter) < 0) continue;
    shown++;
    html += '<div class="rule-item">' +
      '<div class="rule-text"><span class="rule-type">' + escapeHtml(rule.type) + '</span>' +
      '<span class="rule-value">,' + escapeHtml(rule.value) + '</span>' +
      (rule.option ? '<span class="rule-option">,' + escapeHtml(rule.option) + '</span>' : '') + '</div>' +
      '<div class="rule-actions"><button class="btn btn-danger btn-sm" onclick="deletePayloadRule(' + i + ')">删除</button></div>' +
      '</div>';
  }

  if (!html) {
    html = '<div class="rule-empty">' + (parsed.rules.length ? '没有匹配的规则' : '暂无规则，可在上方添加') + '</div>';
  }
  if (filter) count.textContent = parsed.rules.length + ' 条规则，显示 ' + shown + ' 条';
  list.innerHTML = html;
}

function highlightKeyword(text, keyword) {
  if (!keyword) return escapeHtml(text);
  var lower = text.toLowerCase();
  var kwLower = keyword.toLowerCase();
  var result = '';
  var last = 0;
  var idx = lower.indexOf(kwLower, last);
  while (idx >= 0) {
    result += escapeHtml(text.substring(last, idx));
    result += '<span class="search-result-highlight">' + escapeHtml(text.substring(idx, idx + keyword.length)) + '</span>';
    last = idx + keyword.length;
    idx = lower.indexOf(kwLower, last);
  }
  result += escapeHtml(text.substring(last));
  return result;
}

var _globalSearchTimer = null;
function debouncedGlobalSearch() {
  if (_globalSearchTimer) clearTimeout(_globalSearchTimer);
  _globalSearchTimer = setTimeout(globalSearch, 300);
}

function globalSearch() {
  var keyword = document.getElementById('globalSearchInput').value.trim();
  if (!keyword) return;

  // 搜索所有已加载的文件内容（fileBuffers）
  var results = {};
  for (var i = 0; i < FILE_LIST.length; i++) {
    var f = FILE_LIST[i];
    var content = state.fileBuffers[f.path];
    if (content === undefined) continue;
    var lines = content.split('\n');
    for (var l = 0; l < lines.length; l++) {
      if (lines[l].toLowerCase().indexOf(keyword.toLowerCase()) >= 0) {
        if (!results[f.path]) results[f.path] = { file: f, lines: [] };
        results[f.path].lines.push({ num: l + 1, text: lines[l] });
      }
    }
  }

  var total = 0;
  for (var p in results) total += results[p].lines.length;

  // 渲染结果弹窗
  var html = '<div style="font-size:13px;color:var(--muted);margin-bottom:10px">';
  html += '找到 <strong style="color:var(--text)">' + total + '</strong> 条匹配（仅在已加载文件中搜索，未加载的文件请先点击打开）</div>';

  if (total === 0) {
    html += '<div class="rule-empty">未找到匹配 "' + escapeHtml(keyword) + '"</div>';
    document.getElementById('modalTitle').textContent = '🔍 全局搜索';
    document.getElementById('modalBody').innerHTML = html;
    document.querySelector('.modal').style.maxWidth = '700px';
    document.getElementById('modalOverlay').classList.add('show');
    return;
  }

  for (var p in results) {
    var r = results[p];
    html += '<div class="search-result-file">📄 ' + escapeHtml(r.file.name) + '（' + r.lines.length + ' 条）</div>';
    for (var li = 0; li < r.lines.length; li++) {
      var line = r.lines[li];
      html += '<div class="search-result-match" onclick="closeModal();selectFile(\'' + p + '\')">' +
        '<span class="search-result-line">' + line.num + '</span>' +
        '<span class="search-result-text">' + highlightKeyword(line.text.trim(), keyword) + '</span></div>';
    }
  }

  document.getElementById('modalTitle').textContent = '🔍 全局搜索：' + escapeHtml(keyword);
  document.getElementById('modalBody').innerHTML = html;
  document.querySelector('.modal').style.maxWidth = '700px';
  document.getElementById('modalOverlay').classList.add('show');
}

// Myers 差异算法：计算最小编辑操作（LCS 回溯）
function computeDiff(oldLines, newLines) {
  var oldLen = oldLines.length, newLen = newLines.length;
  if (oldLen === 0) return newLines.map(function(c) { return { type: 'add', line: c }; });
  if (newLen === 0) return oldLines.map(function(c) { return { type: 'del', line: c }; });

  // 构建 LCS 长度表（二维）
  var dp = [];
  for (var i = 0; i <= oldLen; i++) {
    dp[i] = new Array(newLen + 1);
    for (var j = 0; j <= newLen; j++) dp[i][j] = 0;
  }
  for (var i = 1; i <= oldLen; i++) {
    for (var j = 1; j <= newLen; j++) {
      dp[i][j] = oldLines[i - 1] === newLines[j - 1]
        ? dp[i - 1][j - 1] + 1
        : Math.max(dp[i - 1][j], dp[i][j - 1]);
    }
  }

  // 回溯生成 diff 操作序列
  var result = [];
  var i = oldLen, j = newLen;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && oldLines[i - 1] === newLines[j - 1]) {
      result.unshift({ type: 'same', line: oldLines[i - 1] });
      i--; j--;
    } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
      result.unshift({ type: 'add', line: newLines[j - 1] });
      j--;
    } else {
      result.unshift({ type: 'del', line: oldLines[i - 1] });
      i--;
    }
  }
  return result;
}

function showDiff() {
  if (!state.currentFile) return;
  var original = state.originalContents[state.currentFile.path] || '';
  var current = document.getElementById('editorContent').value;
  if (original === current) {
    showModal('对比结果', '内容无变化');
    document.querySelector('.modal').style.maxWidth = '';
    return;
  }
  var origLines = original.split('\n');
  var currLines = current.split('\n');
  var diffOps = computeDiff(origLines, currLines);
  var diffHtml = '';
  for (var di = 0; di < diffOps.length; di++) {
    var op = diffOps[di];
    if (op.type === 'add') {
      diffHtml += '<div class="diff-added">+ ' + escapeHtml(op.line) + '</div>';
    } else if (op.type === 'del') {
      diffHtml += '<div class="diff-removed">- ' + escapeHtml(op.line) + '</div>';
    }
  }
  // 显示对比
  document.getElementById('modalTitle').textContent = '📝 变更对比';
  document.getElementById('modalBody').innerHTML = '<div class="diff-content">' + diffHtml + '</div>';
  document.getElementById('modalOverlay').classList.add('show');
  document.querySelector('.modal').style.maxWidth = '700px';
}
